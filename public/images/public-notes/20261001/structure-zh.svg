<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" role="img" aria-labelledby="title desc"><title id="title">周线修复到关口，小周期动能开始减弱</title><desc id="desc">人工构造示意，非实际价格、指标读数或精确未来四价。</desc><rect width="1240" height="800" fill="#0b1220"/><g font-family="Arial, Microsoft YaHei, sans-serif">
<text x="48" y="54" font-size="30" fill="#edf6ff" text-anchor="start">周线修复到关口，小周期动能开始减弱</text>
<text x="48" y="92" font-size="20" fill="#c4d2e5" text-anchor="start">易老师观点 · 2026年10月1日 · 个人研究</text>
<rect x="48" y="114" width="1144" height="48" rx="8" fill="#382c18"/>
<text x="65" y="146" font-size="23" fill="#ffd48a" text-anchor="start">模拟示意 — 不代表实时数据、精确目标价或转折日期</text>
<rect x="85" y="192" width="1070" height="126" rx="14" fill="#112033" stroke="#365168"/>
<text x="113" y="228" font-size="22" fill="#6ee7b7" text-anchor="start">周线：大背景</text>
<text x="113" y="264" font-size="26" fill="#eff6ff" text-anchor="start">DIF从负值修复到零轴附近</text>
<text x="113" y="297" font-size="21" fill="#c4d2e5" text-anchor="start">价格仍需突破压力并守住回踩</text>
<path d="M620 324v14m-7-7 7 7 7-7" fill="none" stroke="#77a491" stroke-width="3"/>
<rect x="85" y="347" width="1070" height="126" rx="14" fill="#112033" stroke="#365168"/>
<text x="113" y="383" font-size="22" fill="#6ee7b7" text-anchor="start">日线／2日线：预警</text>
<text x="113" y="419" font-size="26" fill="#eff6ff" text-anchor="start">价格高点抬升，动能高点降低</text>
<text x="113" y="452" font-size="21" fill="#c4d2e5" text-anchor="start">顶背离 + 死叉，反弹质量下降</text>
<path d="M620 479v14m-7-7 7 7 7-7" fill="none" stroke="#77a491" stroke-width="3"/>
<rect x="85" y="502" width="1070" height="126" rx="14" fill="#112033" stroke="#365168"/>
<text x="113" y="538" font-size="22" fill="#6ee7b7" text-anchor="start">价格：确认</text>
<text x="113" y="574" font-size="26" fill="#eff6ff" text-anchor="start">支撑失守，反抽不能收复</text>
<text x="113" y="607" font-size="21" fill="#c4d2e5" text-anchor="start">更低的高点与低点强化回调判断</text>
<text x="48" y="699" font-size="24" fill="#ffd48a" text-anchor="start">易老师主要判断：至少一个月偏回调，中间允许反弹</text>
<text x="48" y="741" font-size="22" fill="#c4d2e5" text-anchor="start">有效突破 + 回踩不破 + 动能扩张，可使偏空判断失效</text>
<text x="48" y="779" font-size="20" fill="#c4d2e5" text-anchor="start">所查指标资料没有给出这一组合的固定回调周数。</text>
</g></svg>